services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      special-redis:
        condition: service_healthy
    networks:
      - lsbbe_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3003/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'traefik.enable=true'
      - 'prometheus-scrape=true'
      - 'prometheus-port=3003'
      - 'prometheus-path=/metrics'
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: 'lsbbe_nginx'
    ports:
      - '3003:80'
    volumes:
      - ./non-service-conf-files/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lsbbe_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: 'lsbbe_postgres'
    user: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${PG_DB_USER}
      - POSTGRES_PASSWORD=${PG_DB_PASSWORD}
      - POSTGRES_DB=${PG_DB_NAME}
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
      - ./non-service-conf-files/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./non-service-conf-files/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - lsbbe_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_DB_USER} -d ${PG_DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  special-redis:
    image: redis:latest
    container_name: 'lsbbe_redis'
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
    networks:
      - lsbbe_net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: 'lsbbe_prometheus'
    volumes:
      - ./non-service-conf-files/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=remote-write-receiver'
    ports:
      - '9090:9090'
    networks:
      - lsbbe_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 5s
      timeout: 5s
      retries: 5
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
    name: 'postgres_volume'
  redis_data:
    name: 'redis_volume'
  prometheus_data:
    name: 'prometheus_volume'

networks:
  lsbbe_net:
    driver: bridge