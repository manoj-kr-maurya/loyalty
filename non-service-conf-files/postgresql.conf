# GENERAL SETTINGS - Optimized for performance
listen_addresses = '*'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 512MB

# WAL CONFIGURATION
wal_level = replica        # Default level, no logical replication needed
min_wal_size = 512MB       # Set to a value that meets requirements (default segment size is 16MB)
max_wal_size = 2GB         # Upper bound for WAL during checkpoints

# PERFORMANCE OPTIMIZATION
synchronous_commit = on    # Ensures data durability
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1     # Assumes SSDs
effective_io_concurrency = 200

# LOGGING - MINIMAL FOR PRODUCTION
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000  # Only log slow queries

# AUTOVACUUM - OPTIMIZED
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min